<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580" role="img" aria-labelledby="title desc">
<title id="title">qG 和 qA 连接的三个坐标系</title><desc id="desc">机体系向量经 qG 进入近惯性系，再经 qA 进入六轴参考系；加速度在近惯性系低通。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#45636c" stroke-width="1.5"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" fill="#193b43">
<text x="550" y="45" text-anchor="middle" font-size="29" fill="#193b43" font-weight="bold">两个四元数：把快速旋转与慢速倾角修正分开</text>
<rect x="45" y="100" width="270" height="120" rx="12" fill="#e7f3ef" stroke="#6c9998" stroke-width="1.5"/>
<text x="180.0" y="136.0" text-anchor="middle" font-size="22" fill="#193b43" font-weight="normal">机体系 B</text>
<text x="180.0" y="168.0" text-anchor="middle" font-size="19" fill="#193b43" font-weight="normal">随 IMU 转动</text>
<text x="180.0" y="200.0" text-anchor="middle" font-size="19" fill="#193b43" font-weight="normal">aBody、gyro、bias</text>
<rect x="415" y="100" width="270" height="120" rx="12" fill="#e7f3ef" stroke="#6c9998" stroke-width="1.5"/>
<text x="550.0" y="136.0" text-anchor="middle" font-size="22" fill="#193b43" font-weight="normal">近惯性系 I</text>
<text x="550.0" y="168.0" text-anchor="middle" font-size="19" fill="#193b43" font-weight="normal">由去偏陀螺积分维持</text>
<text x="550.0" y="200.0" text-anchor="middle" font-size="19" fill="#193b43" font-weight="normal">允许缓慢积分误差</text>
<rect x="785" y="100" width="270" height="120" rx="12" fill="#e7f3ef" stroke="#6c9998" stroke-width="1.5"/>
<text x="920.0" y="136.0" text-anchor="middle" font-size="22" fill="#193b43" font-weight="normal">六轴参考系 E</text>
<text x="920.0" y="168.0" text-anchor="middle" font-size="19" fill="#193b43" font-weight="normal">+Z 对齐重力参考</text>
<text x="920.0" y="200.0" text-anchor="middle" font-size="19" fill="#193b43" font-weight="normal">水平无绝对北向</text>
<polyline points="315,160 415,160" fill="none" stroke="#45636c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="365" y="133" text-anchor="middle" font-size="21" fill="#193b43" font-weight="normal">R(qG)</text>
<polyline points="685,160 785,160" fill="none" stroke="#45636c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="735" y="133" text-anchor="middle" font-size="21" fill="#193b43" font-weight="normal">R(qA)</text>
<rect x="60" y="330" width="260" height="95" rx="12" fill="#e8eef9" stroke="#6c9998" stroke-width="1.5"/>
<text x="190.0" y="369.5" text-anchor="middle" font-size="22" fill="#193b43" font-weight="normal">aI = R(qG) aBody</text>
<text x="190.0" y="401.5" text-anchor="middle" font-size="19" fill="#193b43" font-weight="normal">先抵消机体旋转</text>
<rect x="420" y="330" width="260" height="95" rx="12" fill="#e8eef9" stroke="#6c9998" stroke-width="1.5"/>
<text x="550.0" y="369.5" text-anchor="middle" font-size="22" fill="#193b43" font-weight="normal">aI_LP = LP(aI)</text>
<text x="550.0" y="401.5" text-anchor="middle" font-size="19" fill="#193b43" font-weight="normal">近惯性系二阶低通</text>
<rect x="780" y="330" width="260" height="95" rx="12" fill="#e8eef9" stroke="#6c9998" stroke-width="1.5"/>
<text x="910.0" y="369.5" text-anchor="middle" font-size="22" fill="#193b43" font-weight="normal">gPre = normalize(</text>
<text x="910.0" y="401.5" text-anchor="middle" font-size="19" fill="#193b43" font-weight="normal">R(qA_old) aI_LP )</text>
<polyline points="320,378 420,378" fill="none" stroke="#45636c" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="680,378 780,378" fill="none" stroke="#45636c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="550" y="495" text-anchor="middle" font-size="23" fill="#193b43" font-weight="normal">最终 q = qA ⊗ qG；倾角校正左乘 qA，陀螺增量右乘 qG。</text>
<text x="550" y="539" text-anchor="middle" font-size="21" fill="#193b43" font-weight="normal">低通可抑制较快线性加速度；持续加速度仍可能污染重力方向。</text>
</g></svg>