<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1070" viewBox="0 0 1100 1070" role="img" aria-labelledby="title desc">
<title id="title">一帧六轴解算的实际顺序</title><desc id="desc">安全检查后依次进行陀螺检测、积分、加速度检测、倾角校正、偏置更新；新偏置反馈到下一帧。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#45636c" stroke-width="1.5"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" fill="#193b43">
<text x="550" y="42" text-anchor="middle" font-size="30" fill="#193b43" font-weight="bold">一帧采样：姿态更新与偏置反馈</text>
<rect x="70" y="80" width="720" height="90" rx="12" fill="#e7f3ef" stroke="#6c9998" stroke-width="1.5"/>
<text x="430.0" y="117.0" text-anchor="middle" font-size="22" fill="#193b43" font-weight="normal">dm_vqf_update()</text>
<text x="430.0" y="149.0" text-anchor="middle" font-size="19" fill="#193b43" font-weight="normal">gyro：rad/s；acc：m/s²；拒绝空指针与 NaN/Inf</text>
<polyline points="430,170 430,210" fill="none" stroke="#45636c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="70" y="210" width="720" height="90" rx="12" fill="#e7f3ef" stroke="#6c9998" stroke-width="1.5"/>
<text x="430.0" y="247.0" text-anchor="middle" font-size="22" fill="#193b43" font-weight="normal">① check_gyro_rest()</text>
<text x="430.0" y="279.0" text-anchor="middle" font-size="19" fill="#193b43" font-weight="normal">restBias 或 magDist 开启时：低通、变化量、幅度检查</text>
<polyline points="430,300 430,340" fill="none" stroke="#45636c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="70" y="340" width="720" height="90" rx="12" fill="#e7f3ef" stroke="#6c9998" stroke-width="1.5"/>
<text x="430.0" y="377.0" text-anchor="middle" font-size="22" fill="#193b43" font-weight="normal">② integrate_gyro()</text>
<text x="430.0" y="409.0" text-anchor="middle" font-size="19" fill="#193b43" font-weight="normal">减去当前 bias → 旋转增量 → qG 右乘并归一化</text>
<polyline points="430,430 430,470" fill="none" stroke="#45636c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="70" y="470" width="720" height="90" rx="12" fill="#e7f3ef" stroke="#6c9998" stroke-width="1.5"/>
<text x="430.0" y="507.0" text-anchor="middle" font-size="22" fill="#193b43" font-weight="normal">③ check_acc_rest()</text>
<text x="430.0" y="539.0" text-anchor="middle" font-size="19" fill="#193b43" font-weight="normal">静止估计开启时：加速度稳定检测、累计持续时间</text>
<polyline points="430,560 430,600" fill="none" stroke="#45636c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="70" y="600" width="720" height="90" rx="12" fill="#e7f3ef" stroke="#6c9998" stroke-width="1.5"/>
<text x="430.0" y="637.0" text-anchor="middle" font-size="22" fill="#193b43" font-weight="normal">④ correct_inclination()</text>
<text x="430.0" y="669.0" text-anchor="middle" font-size="19" fill="#193b43" font-weight="normal">qG 旋转加速度 → 低通 → 用 qA 校正倾斜</text>
<polyline points="430,690 430,730" fill="none" stroke="#45636c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="70" y="730" width="720" height="90" rx="12" fill="#fff0dc" stroke="#6c9998" stroke-width="1.5"/>
<text x="430.0" y="767.0" text-anchor="middle" font-size="22" fill="#193b43" font-weight="normal">⑤ update_bias()</text>
<text x="430.0" y="799.0" text-anchor="middle" font-size="19" fill="#193b43" font-weight="normal">准备 H/e/W → 预测 P → 有观测时更新 bias/P</text>
<polyline points="430,820 430,860" fill="none" stroke="#45636c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="70" y="860" width="720" height="90" rx="12" fill="#e7f3ef" stroke="#6c9998" stroke-width="1.5"/>
<text x="430.0" y="897.0" text-anchor="middle" font-size="22" fill="#193b43" font-weight="normal">输出 q = qA ⊗ qG</text>
<text x="430.0" y="929.0" text-anchor="middle" font-size="19" fill="#193b43" font-weight="normal">get_quaternion / get_euler 只读出结果，不推进状态</text>
<rect x="830" y="330" width="230" height="112" rx="12" fill="#fff0dc" stroke="#6c9998" stroke-width="1.5"/>
<text x="945.0" y="362.0" text-anchor="middle" font-size="22" fill="#193b43" font-weight="normal">bias 反馈</text>
<text x="945.0" y="394.0" text-anchor="middle" font-size="19" fill="#193b43" font-weight="normal">新估计作用于</text>
<text x="945.0" y="426.0" text-anchor="middle" font-size="19" fill="#193b43" font-weight="normal">下一帧陀螺积分</text>
<polyline points="790,775 1075,775 1075,385 1060,385" fill="none" stroke="#45636c" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="8 6"/>
<polyline points="830,385 790,385" fill="none" stroke="#45636c" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="8 6"/>
<text x="808" y="458" text-anchor="start" font-size="19" fill="#193b43" font-weight="normal">acc 全零：积分后返回</text>
<text x="808" y="699" text-anchor="start" font-size="18" fill="#193b43" font-weight="normal">两种偏置估计</text>
<text x="808" y="725" text-anchor="start" font-size="18" fill="#193b43" font-weight="normal">均关闭：跳过⑤</text>
<text x="70" y="1000" text-anchor="start" font-size="21" fill="#193b43" font-weight="normal">执行顺序决定状态含义：本帧积分使用旧 bias，运动残差保留倾角校正前的方向。</text>
<text x="70" y="1035" text-anchor="start" font-size="19" fill="#193b43" font-weight="normal">安全接口检查一次；核心函数不重复检查。图示省略数学辅助函数内部循环。</text>
</g></svg>