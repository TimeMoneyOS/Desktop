<text x="415" y="389" font-size="16" fill="#3d5560">同时控制两个前哨：+1/秒</text>
<text x="415" y="414" font-size="16" fill="#3d5560">同时控制两个基地：+3/秒</text>
<rect x="750" y="325" width="290" height="125" rx="12" fill="white" stroke="#347bb3" stroke-width="2"/>
<rect x="750" y="337" width="5" height="101" fill="#347bb3"/>
