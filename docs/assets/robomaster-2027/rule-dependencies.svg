<text x="60" y="414" font-size="16" fill="#3d5560">临时控制与完全控制</text>
<rect x="395" y="325" width="290" height="125" rx="12" fill="white" stroke="#347bb3" stroke-width="2"/>
<rect x="395" y="337" width="5" height="101" fill="#347bb3"/>
