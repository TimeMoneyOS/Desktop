<rect x="395" y="132" width="5" height="106" fill="#008577"/>
<text x="415" y="154" font-size="21" font-weight="700" fill="#143b45">工作台与重装火力</text>
<text x="415" y="184" font-size="16" fill="#3d5560">另有差值相关时间解锁路径</text>
<text x="415" y="209" font-size="16" fill="#3d5560">安装、确认后投入重火力</text>
<rect x="750" y="120" width="290" height="130" rx="12" fill="white" stroke="#c46e32" stroke-width="2"/>
