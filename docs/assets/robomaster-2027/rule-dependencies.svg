<text x="770" y="154" font-size="21" font-weight="700" fill="#143b45">基地血量与后勤</text>
<text x="770" y="184" font-size="16" fill="#3d5560">血量降低 → 后勤系数降低</text>
<text x="770" y="209" font-size="16" fill="#3d5560">回血、复活、通信、图传受影响</text>
