<g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="42" y="52" font-size="28" font-weight="700" fill="#143b45">2027：装配、控图、信息形成联动</text><text x="42" y="84" font-size="16" fill="#526b74">规则关系示意 · 非对局仿真 · 对应正文各章节</text>
